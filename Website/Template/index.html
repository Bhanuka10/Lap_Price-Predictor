<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Form.css') }}">
</head>
<body>
    <div class="main-container">
        <div class="header-box">
            <h1>💻 Laptop Price Predictor</h1>
        </div>
        
        <div class="form-box">
            <form action="/" method="POST">
                <div class="input-row">
                    <div class="input-box">
                        <label for="Ram">RAM (GB)</label>
                        <input type="text" id="Ram" name="Ram" placeholder="e.g., 8, 16, 32" required>
                    </div>

                    <div class="input-box">
                        <label for="Weight">Weight (kg)</label>
                        <input type="text" id="Weight" name="Weight" placeholder="e.g., 1.5, 2.0" required>
                    </div>
                </div>

                <div class="checkbox-container">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="Touchscreen" name="Touchscreen">
                        <label for="Touchscreen">Touchscreen</label>
                    </div>

                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="IPS" name="IPS">
                        <label for="IPS">IPS Display</label>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-box">
                        <label for="Companey">Company</label>
                        <select name="Companey" id="Companey" required>
                            <option value="" hidden>Select Company</option>
                            <option value="Acer">Acer</option>
                            <option value="Apple">Apple</option>
                            <option value="Asus">Asus</option>
                            <option value="Dell">Dell</option>
                            <option value="HP">HP</option>
                            <option value="Lenovo">Lenovo</option>
                            <option value="MSI">MSI</option>
                            <option value="Toshiba">Toshiba</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="TypeName">Type</label>
                        <select name="TypeName" id="TypeName" required>
                            <option value="" hidden>Select Type</option>
                            <option value="2 in 1 Convertible">2 in 1 Convertible</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Notebook">Notebook</option>
                            <option value="Netbook">Netbook</option>
                            <option value="Ultrabook">Ultrabook</option>
                            <option value="Workstation">Workstation</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-box">
                        <label for="OperatingSystem">Operating System</label>
                        <select name="OperatingSystem" id="OperatingSystem" required>
                            <option value="" hidden>Select OS</option>
                            <option value="Windows">Windows</option>
                            <option value="MacOS">MacOS</option>
                            <option value="Linux">Linux</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="cpu">CPU</label>
                        <select name="cpu" id="cpu" required>
                            <option value="" hidden>Select CPU</option>
                            <option value="intel core i7">Intel Core i7</option>
                            <option value="intel core i5">Intel Core i5</option>
                            <option value="intel core i3">Intel Core i3</option>
                            <option value="other intel processor">Other Intel Processor</option>
                            <option value="amd processor">AMD Processor</option>
                        </select>
                    </div>
                </div>

                <div class="input-box">
                    <label for="gpu">GPU</label>
                    <select name="gpu" id="gpu" required>
                        <option value="" hidden>Select GPU</option>
                        <option value="amd">AMD</option>
                        <option value="intel">Intel</option>
                        <option value="nvidia">Nvidia</option>
                    </select>
                </div>
                
                <div class="submit-box">
                    <input type="submit" value="🔮 Predict Price">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
